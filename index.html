<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ピアノ初段</title>
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./shodan.css">
<link rel="stylesheet" href="./adventure.css">
</head>
<body>
<div id="app">
<main class="boot">
<h1>ピアノ初段</h1>
<p id="boot-wait" role="status">れんしゅうをひらいています…</p>
</main>
</div>
<div id="toast" role="status" aria-live="polite">
</div>
<dialog id="dialog" aria-label="えらぶ">
</dialog>
<script>
(function () {
  // 部品が1つ取れないとモジュール全体が動かない。1回だけ自動で開き直し、だめならボタンを出す。
  var settled = false;
  window.__bootStuck = function () {
    if (settled) return;
    var wait = document.getElementById("boot-wait");
    if (!wait) return;
    settled = true;
    var tried = true;
    try {
      tried = sessionStorage.getItem("piano-boot-retry") === "1";
      if (!tried) sessionStorage.setItem("piano-boot-retry", "1");
    } catch (error) {}
    if (!tried) {
      location.reload();
      return;
    }
    wait.textContent = "ひらけなかったよ。電ぱをたしかめて、もう1回おしてね。";
    var button = document.createElement("button");
    button.type = "button";
    button.id = "boot-retry";
    button.textContent = "もう1回ひらく";
    button.onclick = function () { location.reload(); };
    wait.parentNode.appendChild(button);
  };
  setTimeout(window.__bootStuck, 10000);
})();
</script>
<script type="module" src="./js/app.mjs?v=3" onerror="window.__bootStuck()">
</script>
<noscript>このアプリはJavaScriptを使います。SafariのせっていでJavaScriptをオンにしてください。</noscript>
</body>
</html>
